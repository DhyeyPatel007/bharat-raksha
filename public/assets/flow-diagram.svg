<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .bg { fill: #FBF9F5; stroke: #E6DFD5; stroke-width: 1.5; }
      .num { font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; fill: #C93A1B; font-weight: bold; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #1A1A1A; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #5A554E; line-height: 1.5; }
      .arrow { stroke: #C93A1B; stroke-width: 2; stroke-dasharray: 4 4; }
      .pill { fill: #F4EBE1; stroke: #DECFC0; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#C93A1B" />
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="20" y="20" width="260" height="240" rx="8" class="bg" />
  <circle cx="56" cy="56" r="22" class="pill" />
