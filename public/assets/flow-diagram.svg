    <tspan x="40" dy="24">• ORDER_NOT_FOUND guard</tspan>
  </text>

  <!-- Arrow 1 to 2 -->
  <path d="M 285 140 L 325 140" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 2 -->
  <rect x="330" y="20" width="260" height="240" rx="8" class="bg" />
  <circle cx="366" cy="56" r="22" class="pill" />
  <text x="358" y="65" class="num">02</text>
  <text x="402" y="52" class="title">Swarm Forensics</text>
  <text x="402" y="70" font-family="sans-serif" font-size="11px" fill="#8C8275" font-weight="600">3-JUROR LLM AUDIT</text>
  <text x="350" y="112" class="desc">
    <tspan x="350" dy="0">• Juror 1: Razorpay RRN State</tspan>
    <tspan x="350" dy="24">• Juror 2: Shiprocket Scale &amp; OTP</tspan>
    <tspan x="350" dy="24">• Juror 3: Buyer Abuse History</tspan>
    <tspan x="350" dy="24">• Qwen 30B via Token Factory</tspan>
    <tspan x="350" dy="24">• Hare-Niemeyer Score Math</tspan>
  </text>

  <!-- Arrow 2 to 3 -->
  <path d="M 595 140 L 635 140" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 3 -->
  <rect x="640" y="20" width="240" height="240" rx="8" class="bg" />
  <circle cx="676" cy="56" r="22" class="pill" />
  <text x="668" y="65" class="num">03</text>
  <text x="712" y="52" class="title">Merchant Gate</text>
  <text x="712" y="70" font-family="sans-serif" font-size="11px" fill="#8C8275" font-weight="600">HUMAN APPROVAL</text>
  <text x="660" y="112" class="desc">
    <tspan x="660" dy="0">• 1-Tap Approve / Reject</tspan>
    <tspan x="660" dy="24">• Telegram Bot DM Alert</tspan>
    <tspan x="660" dy="24">• Zero Silent Auto-Refunds</tspan>
    <tspan x="660" dy="24">• Live Razorpay Settlement</tspan>
    <tspan x="660" dy="24">• NCH Evidence Dossier PDF</tspan>
